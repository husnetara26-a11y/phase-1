<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
</head>

<body>

    <header>

        <h1>FEEDBACK</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="course.html">Courses</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="grade.html">Grades</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>
        </nav>               

    </header>

    <main>

        <h2>Share Your Feedback</h2>

        <p>
            Fill the form below to share your feedback or your thoughts.
        </p>

        <form>

            <label for="name"><strong>Name:</strong></label>
            <br>
            <input type="text" id="name" name="name">
            <br><br>

            <label for="email"><strong>Email:</strong></label>
            <br>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="address"><strong>Address:</strong></label>
            <br>
            <input type="text" id="address" name="address">
            <br><br>

            <label for="phoneno"><strong>Phone No:</strong></label>
            <br>
            <input type="tel" id="phoneno" name="phoneno">
            <br><br>

            <label><strong>Gender:</strong></label>
            <br>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>

            <br><br>

            <label for="feedback"><strong>Feedback:</strong></label>
            <br>
            <textarea id="feedback" name="feedback"></textarea>

            <br><br>

            <label for="givereview">
                <strong>Give Review:</strong>
            </label>

            <select id="givereview" name="givereview">
                <option value="Good">Good</option>
                <option value="Very Good">Very Good</option>
                <option value="Excellent">Excellent</option>
                <option value="Okay">Okay</option>
                <option value="Bad">Bad</option>
            </select>

            <br><br>

            <button type="submit">Submit</button>

        </form>

    </main>

    <br>
    <hr>

    <footer>
        <p>2026 Student Portal. All rights reserved.</p>
    </footer>

</body>

</html>
